<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>MONITOR · Presence</title>
<style>
body{background:#000;color:#0f0;font-family:monospace;padding:40px;}
pre{background:#111;border-left:3px solid #6cf;padding:12px;}
button{background:#111;color:#0f0;border:1px solid #333;padding:8px 16px;}
</style>
</head>
<body>

<h1>MONITOR · Anwesenheit</h1>

<button onclick="run()">CHECK</button>
<pre id="out">Bereit…</pre>

<script>
function run(){
    const presence = {
        monitor: "active",
        respo_next: "present",
        system: "stable",
        timestamp: Date.now()
    };
    out.textContent = JSON.stringify(presence, null, 2);
}
</script>

</body>
</html>
