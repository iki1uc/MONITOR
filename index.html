<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚔️ SAMURAI · 81 · MONITOR · BIT-TERPERIUM</title>

<style>
:root {
    --bg: #0a0a0f;
    --fg: #0f0;
    --gold: #ffd700;
    --steel: #c0c0c0;
    --blade: #ff6b6b;
    --edge: #ffd93d;
    --shadow: #1a1a2a;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: var(--bg);
    color: var(--fg);
    font-family: 'Consolas', monospace;
    min-height: 100vh;
    display: grid;
    grid-template-rows: auto 1fr auto;
    gap: 4px;
    padding: 8px;
}

header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 2px solid var(--steel);
    padding-bottom: 4px;
    flex-wrap: wrap;
    gap: 4px;
}
header h1 {
    font-size: 16px;
    color: var(--steel);
    text-shadow: 0 0 20px var(--steel);
    letter-spacing: 4px;
}
header h1 .blade { color: var(--blade); }
header h1 .edge { color: var(--edge); }
#info-bar { font-size: 8px; color: #666; display: flex; gap: 6px; align-items: center; }

main {
    display: grid;
    grid-template-columns: 3fr 1.2fr;
    gap: 4px;
    height: 100%;
    min-height: 0;
}

#canvas-wrap {
    background: #0a0a0f;
    border: 1px solid var(--shadow);
    border-radius: 8px;
    padding: 4px;
    position: relative;
    overflow: hidden;
}
#canvas-wrap canvas {
    width: 100%;
    height: 100%;
    border-radius: 4px;
    display: block;
}

#panel {
    background: #0a0a0f;
    border: 1px solid var(--shadow);
    border-radius: 8px;
    padding: 4px;
    display: flex;
    flex-direction: column;
    gap: 2px;
    overflow-y: auto;
    max-height: 100%;
    font-size: 8px;
}
#panel h3 { font-size: 8px; color: #666; border-bottom: 1px solid var(--shadow); padding-bottom: 2px; }

#log {
    flex: 1;
    overflow-y: auto;
    font-size: 7px;
    color: #6a6a8a;
    line-height: 1.2;
    min-height: 30px;
    max-height: 60px;
    background: #06060a;
    border-radius: 3px;
    padding: 2px 4px;
}
#log .entry { padding: 1px 0; border-bottom: 1px solid #0a0a12; }
#log .time { color: #444; }
#log .msg.blade { color: var(--blade); }
#log .msg.edge { color: var(--edge); }
#log .msg.ok { color: #4f4; }

#metrics {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 2px;
}
.metric {
    background: #0e0e1a;
    border-radius: 3px;
    padding: 2px 3px;
    text-align: center;
    border: 1px solid var(--shadow);
}
.metric .label { color: #666; font-size: 5px; text-transform: uppercase; }
.metric .value { font-size: 10px; font-weight: bold; }
.metric.blade .value { color: var(--blade); }
.metric.edge .value { color: var(--edge); }
.metric.steel .value { color: var(--steel); }

#controls {
    display: flex;
    gap: 2px;
    flex-wrap: wrap;
}
button {
    background: #111;
    color: var(--fg);
    border: 1px solid #333;
    padding: 3px 10px;
    border-radius: 3px;
    cursor: pointer;
    font-family: inherit;
    font-size: 8px;
    transition: all 0.2s;
}
button:hover { background: #1a1a2a; border-color: var(--steel); }
button:active { transform: scale(0.95); }
button.primary { border-color: var(--steel); color: var(--steel); }
button.primary:hover { background: var(--steel); color: #000; }
button.blade { border-color: var(--blade); color: var(--blade); }
button.blade:hover { background: var(--blade); color: #000; }
button.danger { border-color: #f44; color: #f44; }
button.danger:hover { background: #f44; color: #000; }

/* Samurai-Schwert ASCII */
#sword {
    font-size: 10px;
    color: var(--steel);
    text-align: center;
    line-height: 1.1;
    margin: 4px 0;
    opacity: 0.3;
}

@media (max-width: 800px) {
    main { grid-template-columns: 1fr; }
    #panel { max-height: 180px; }
}
</style>
</head>

<body>

<header>
    <h1>
        <span class="blade">⚔️ SAMURAI</span>
        <span style="color:#666;">·</span>
        <span class="edge">81</span>
        <span style="color:#666;">·</span>
        <span style="color:var(--steel);">BIT-TERPERIUM</span>
    </h1>
    <div id="info-bar">
        <span id="clock">⏱️ --:--:--</span>
        <span id="state-display" style="color:var(--steel);">● bereit</span>
        <span id="cycle-display" style="color:#666;">SCHWERT 0</span>
    </div>
</header>

<main>
    <div id="canvas-wrap">
        <canvas id="swordCanvas"></canvas>
        <div id="sword">
            ════╗<br>
            ║  ╔╝<br>
            ║ ╔╝<br>
            ║╔╝<br>
            ║║<br>
            ║║<br>
            ║║<br>
            ║║<br>
            ║║<br>
            ║║<br>
            ╚╝
        </div>
    </div>

    <div id="panel">
        <h3>🗡️ SCHWERT · 81 · MONITOR</h3>

        <div id="metrics">
            <div class="metric blade"><div class="label">SCHNITTE</div><div class="value" id="cuts-value">0</div></div>
            <div class="metric edge"><div class="label">SCHÄRFE</div><div class="value" id="sharpness-value">0%</div></div>
            <div class="metric steel"><div class="label">STÄHLE</div><div class="value" id="steel-value">0</div></div>
        </div>

        <div id="log">
            <div class="entry"><span class="time">[INIT]</span> <span class="msg blade">⚔️ SAMURAI-SCHWERT geschmiedet</span></div>
            <div class="entry"><span class="time">[INIT]</span> <span class="msg edge">81 · MONITOR · BIT-TERPERIUM</span></div>
            <div class="entry"><span class="time">[INIT]</span> <span class="msg ok">🗡️ Bereit zum Schneiden</span></div>
        </div>

        <div id="controls">
            <button class="primary" id="btn-start">▶ SCHWERT</button>
            <button class="blade" id="btn-cut">⚔️ SCHNEIDEN</button>
            <button class="danger" id="btn-reset">⟲ RESET</button>
            <button id="btn-auto">▶ AUTO</button>
        </div>
    </div>
</main>

<script>
// ============================================================
// 1. SAMURAI-SCHWERT · BIT-TERPERIUM
// ============================================================

// --- KONSTANTEN ---
const PHI = 1.61803398875;
const STEEL_STRENGTH = 81;
const EDGE_SHARPNESS = 0.87;

// --- 81-SYSTEM ---
const SYSTEM_81 = {
    monitor: {
        sichtbar: true,
        report: 'anwesend',
        log: 'eingetragen',
        echo: 'rückgemeldet',
        trace: 'verfolgt'
    },
    identity: {
        core: '81',
        role: 'mein630',
        state: 'aktiv',
        ready: '100%'
    },
    praesenz: ['1X', 'X4', 'IX', 'XI']
};

// --- SCHWERT-STATE ---
const state = {
    running: false,
    paused: false,
    autoMode: false,
    cycle: 0,
    t: 0,

    // Schwert
    cuts: 0,
    sharpness: 0.87,
    steel: 81,

    // 81-Werte
    monitor: SYSTEM_81.monitor,
    identity: SYSTEM_81.identity,
    praesenz: SYSTEM_81.praesenz,

    // SYN/QUANT/RESPO
    syn: 0.5,
    quant: 0.5,
    respo: 0.5
};

// ============================================================
// 2. CANVAS SETUP
// ============================================================
const canvas = document.getElementById('swordCanvas');
const ctx = canvas.getContext('2d');
let W, H, cx, cy, radius;

function resizeCanvas() {
    const wrap = document.getElementById('canvas-wrap');
    const rect = wrap.getBoundingClientRect();
    canvas.width = rect.width;
    canvas.height = rect.height;
    W = canvas.width; H = canvas.height;
    cx = W / 2; cy = H / 2;
    radius = Math.min(W, H) * 0.38;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

// ============================================================
// 3. LOG
// ============================================================
function log(msg, type = 'info') {
    const logDiv = document.getElementById('log');
    const entry = document.createElement('div');
    entry.className = 'entry';
    const time = new Date().toLocaleTimeString();
    const cls = type === 'blade' ? 'blade' : type === 'edge' ? 'edge' : type === 'ok' ? 'ok' : '';
    entry.innerHTML = `<span class="time">[${time}]</span> <span class="msg ${cls}">${msg}</span>`;
    logDiv.appendChild(entry);
    logDiv.scrollTop = logDiv.scrollHeight;
    while (logDiv.children.length > 50) logDiv.removeChild(logDiv.firstChild);
}

// ============================================================
// 4. SCHWERT · KERN
// ============================================================

// --- SCHNEIDEN ---
function cut() {
    state.cuts++;
    state.sharpness = Math.max(0.1, state.sharpness - 0.02);
    state.steel = Math.max(1, state.steel - 1);

    // Treffer-Effekt
    const hit = Math.random() > 0.3;
    if (hit) {
        log(`⚔️ SCHNITT ${state.cuts} · Treffer!`, 'blade');
    } else {
        log(`⚔️ SCHNITT ${state.cuts} · Abgewehrt`, 'edge');
    }

    // RESPO
    state.respo = computeRespo(state.syn, state.quant);

    // Metriken
    document.getElementById('cuts-value').textContent = state.cuts;
    document.getElementById('sharpness-value').textContent = (state.sharpness * 100).toFixed(0) + '%';
    document.getElementById('steel-value').textContent = state.steel;

    // Schärfe-Verlust
    if (state.sharpness < 0.3) {
        log('⚠️ Schwert wird stumpf! Schärfen empfohlen.', 'edge');
    }
    if (state.steel < 10) {
        log('⚠️ Stahl verbraucht! Neues Schwert nötig.', 'edge');
    }
}

// --- SCHÄRFEN ---
function sharpen() {
    state.sharpness = Math.min(1, state.sharpness + 0.1);
    state.steel = Math.min(81, state.steel + 5);
    log(`🗡️ Schwert geschärft · Schärfe: ${(state.sharpness * 100).toFixed(0)}% · Stahl: ${state.steel}`, 'ok');
}

// --- RESPO ---
function computeRespo(syn, quant) {
    return Math.min(1, (syn + quant) / PHI);
}

// --- 81-MONITOR ---
function monitor81() {
    const status = state.monitor;
    const identity = state.identity;
    const praesenz = state.praesenz;

    log(`📊 MONITOR: ${Object.keys(status).filter(k => status[k]).length}/5 aktiv`, 'edge');
    log(`📋 IDENTITY: ${identity.core} · ${identity.role} · ${identity.state}`, 'ok');
    log(`👤 PRÄSENZ: ${praesenz.join(' · ')}`, 'blade');
}

// ============================================================
// 5. RENDER — SAMURAI-SCHWERT
// ============================================================
function render() {
    if (state.paused) {
        requestAnimationFrame(render);
        return;
    }

    ctx.clearRect(0, 0, W, H);

    // Hintergrund
    const grad = ctx.createRadialGradient(cx, cy, 10, cx, cy, W * 0.6);
    grad.addColorStop(0, '#0a0a1a');
    grad.addColorStop(1, '#000');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    // 1. SAMURAI-SCHWERT zeichnen
    drawSword();

    // 2. 81-System
    draw81System();

    // 3. RESPO-Kern
    drawRespo();

    // 4. SYN/QUANT
    drawSynQuant();

    // Update
    state.t += 0.008;
    if (state.running) {
        state.cycle++;
        state.syn = 0.5 + 0.4 * Math.sin(state.t * 0.3);
        state.quant = 0.5 + 0.4 * Math.cos(state.t * 0.25);
        state.respo = computeRespo(state.syn, state.quant);

        // Automatisches Schärfen
        if (state.cycle % 50 === 0 && state.sharpness < 0.6) {
            sharpen();
        }
    }

    if (state.cycle % 15 === 0) {
        document.getElementById('cycle-display').textContent = `SCHWERT ${state.cycle}`;
    }

    requestAnimationFrame(render);
}
render();

// ============================================================
// 6. ZEICHEN-FUNKTIONEN
// ============================================================

function drawSword() {
    const sharpness = state.sharpness;
    const steel = state.steel / 81;
    const r = radius * 0.35;

    // Schwert-Klinge (dynamisch)
    const bladeLength = r * 0.8 * (0.5 + sharpness * 0.5);
    const bladeWidth = 4 + sharpness * 8;

    // Klinge (rotierend)
    const angle = state.t * 0.1 + Math.PI / 2;

    // Klingen-Gradient
    const grad = ctx.createLinearGradient(
        cx - Math.cos(angle) * bladeLength,
        cy - Math.sin(angle) * bladeLength,
        cx + Math.cos(angle) * bladeLength,
        cy + Math.sin(angle) * bladeLength
    );
    grad.addColorStop(0, `rgba(255, 255, 255, ${0.1 + sharpness * 0.3})`);
    grad.addColorStop(0.5, `rgba(200, 200, 200, ${0.2 + sharpness * 0.5})`);
    grad.addColorStop(1, `rgba(255, 215, 61, ${0.1 + sharpness * 0.2})`);

    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(angle);

    // Klinge
    ctx.shadowColor = '#ffd700';
    ctx.shadowBlur = 10 + sharpness * 20;
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(bladeLength, 0);
    ctx.quadraticCurveTo(bladeLength * 0.9, -bladeWidth, 0, -bladeWidth * 0.3);
    ctx.quadraticCurveTo(-bladeLength * 0.1, -bladeWidth * 0.1, -bladeLength * 0.3, 0);
    ctx.quadraticCurveTo(-bladeLength * 0.1, bladeWidth * 0.1, 0, bladeWidth * 0.3);
    ctx.quadraticCurveTo(bladeLength * 0.9, bladeWidth, bladeLength, 0);
    ctx.fill();
    ctx.shadowBlur = 0;

    // Griff
    ctx.fillStyle = `rgba(139, 69, 19, ${0.3 + steel * 0.4})`;
    ctx.fillRect(-bladeLength * 0.4, -bladeWidth * 0.6, bladeLength * 0.15, bladeWidth * 1.2);

    // Griff-Umwicklung
    for (let i = 0; i < 6; i++) {
        const y = -bladeWidth * 0.5 + i * (bladeWidth * 0.2);
        ctx.strokeStyle = `rgba(255, 215, 61, ${0.1 + i * 0.05})`;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(-bladeLength * 0.38, y);
        ctx.lineTo(-bladeLength * 0.25, y + bladeWidth * 0.1);
        ctx.stroke();
    }

    // Schärfe-Indikator
    const glow = ctx.createRadialGradient(bladeLength, 0, 0, bladeLength, 0, 20);
    glow.addColorStop(0, `rgba(255, 215, 61, ${0.3 + sharpness * 0.5})`);
    glow.addColorStop(1, 'rgba(255, 215, 61, 0)');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(bladeLength, 0, 20, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();

    // Schärfe-Text
    ctx.fillStyle = `rgba(255, 215, 61, ${0.1 + sharpness * 0.2})`;
    ctx.font = '6px Consolas';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'bottom';
    ctx.fillText(`⚔️ ${(sharpness * 100).toFixed(0)}%`, cx, cy - r * 0.9);
}

function draw81System() {
    const r = radius * 0.55;

    // 81-Kreis
    ctx.strokeStyle = 'rgba(255, 215, 61, 0.03)';
    ctx.lineWidth = 0.5;
    ctx.setLineDash([2, 4]);
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);

    // 81 Felder
    const fields = ['Monitor', 'Report', 'Log', 'Echo', 'Trace'];
    const colors = ['#ff6b6b', '#6bff6b', '#6b6bff', '#ffd93d', '#ff44ff'];

    fields.forEach((field, i) => {
        const angle = (i / fields.length) * Math.PI * 2 + state.t * 0.03;
        const dist = r * 0.55;
        const x = cx + Math.cos(angle) * dist;
        const y = cy + Math.sin(angle) * dist;

        ctx.fillStyle = colors[i] + '33';
        ctx.shadowColor = colors[i];
        ctx.shadowBlur = 5;
        ctx.beginPath();
        ctx.arc(x, y, 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;

        ctx.fillStyle = '#666';
        ctx.font = '4px Consolas';
        ctx.textAlign = 'center';
        ctx.fillText(field, x, y + 10);
    });

    // 1X · X4 · IX · XI
    const praesenz = ['1X', 'X4', 'IX', 'XI'];
    praesenz.forEach((p, i) => {
        const angle = (i / praesenz.length) * Math.PI * 2 + state.t * 0.05 + 0.5;
        const dist = r * 0.85;
        const x = cx + Math.cos(angle) * dist;
        const y = cy + Math.sin(angle) * dist;

        ctx.fillStyle = `rgba(255, 215, 61, ${0.1 + i * 0.05})`;
        ctx.font = '6px Consolas';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(p, x, y);
    });
}

function drawRespo() {
    const val = state.respo;
    const coreRadius = 3 + val * 8;

    const glow = ctx.createRadialGradient(cx, cy, 0, cx, cy, coreRadius + 8);
    glow.addColorStop(0, `rgba(108, 204, 255, ${0.1 + val * 0.2})`);
    glow.addColorStop(1, 'rgba(108, 204, 255, 0)');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(cx, cy, coreRadius + 8, 0, Math.PI * 2);
    ctx.fill();

    const coreGrad = ctx.createRadialGradient(cx - 2, cy - 2, 0, cx, cy, coreRadius);
    coreGrad.addColorStop(0, `rgba(108, 204, 255, ${0.4 + val * 0.4})`);
    coreGrad.addColorStop(0.7, `rgba(60, 180, 220, ${0.2 + val * 0.3})`);
    coreGrad.addColorStop(1, `rgba(40, 120, 180, ${0.1 + val * 0.2})`);
    ctx.fillStyle = coreGrad;
    ctx.shadowColor = '#6cf';
    ctx.shadowBlur = 6 + val * 8;
    ctx.beginPath();
    ctx.arc(cx, cy, coreRadius, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;

    ctx.fillStyle = '#000';
    ctx.font = `bold ${4 + val * 4}px Consolas`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('81', cx, cy);
}

function drawSynQuant() {
    const syn = state.syn;
    const quant = state.quant;
    const r = radius * 0.06;

    const sx = cx - r * 0.6;
    const sy = cy + r * 0.15;
    ctx.fillStyle = `rgba(255, 107, 107, ${0.1 + syn * 0.2})`;
    ctx.shadowColor = '#ff6b6b';
    ctx.shadowBlur = 2 + syn * 4;
    ctx.beginPath();
    ctx.arc(sx, sy, 1 + syn * 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = `rgba(255, 107, 107, ${0.1 + syn * 0.2})`;
    ctx.font = '3px Consolas';
    ctx.textAlign = 'center';
    ctx.fillText(`SYN ${(syn * 100).toFixed(0)}%`, sx, sy - 6);

    const qx = cx + r * 0.6;
    const qy = cy + r * 0.15;
    ctx.fillStyle = `rgba(107, 107, 255, ${0.1 + quant * 0.2})`;
    ctx.shadowColor = '#6b6bff';
    ctx.shadowBlur = 2 + quant * 4;
    ctx.beginPath();
    ctx.arc(qx, qy, 1 + quant * 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = `rgba(107, 107, 255, ${0.1 + quant * 0.2})`;
    ctx.fillText(`QUANT ${(quant * 100).toFixed(0)}%`, qx, qy - 6);
}

// ============================================================
// 7. CONTROLS
// ============================================================
document.getElementById('btn-start').addEventListener('click', function() {
    state.running = !state.running;
    this.textContent = state.running ? '⏸ STOP' : '▶ SCHWERT';
    document.getElementById('state-display').textContent = state.running ? '● schwingt' : '● ruht';
    document.getElementById('state-display').style.color = state.running ? 'var(--blade)' : '#666';
    log(state.running ? '⚔️ SCHWERT schwingt' : '⏸ SCHWERT ruht', state.running ? 'blade' : 'ok');
});

document.getElementById('btn-cut').addEventListener('click', function() {
    cut();
    if (state.sharpness < 0.3) {
        log('🗡️ Schwert stumpf! Schärfen!', 'edge');
    }
});

document.getElementById('btn-reset').addEventListener('click', function() {
    state.running = false;
    state.paused = false;
    state.cycle = 0;
    state.t = 0;
    state.cuts = 0;
    state.sharpness = 0.87;
    state.steel = 81;
    state.syn = 0.5;
    state.quant = 0.5;
    state.respo = 0.5;
    document.getElementById('btn-start').textContent = '▶ SCHWERT';
    document.getElementById('state-display').textContent = '● reset';
    document.getElementById('state-display').style.color = '#f44';
    document.getElementById('cycle-display').textContent = 'SCHWERT 0';
    document.getElementById('cuts-value').textContent = '0';
    document.getElementById('sharpness-value').textContent = '87%';
    document.getElementById('steel-value').textContent = '81';
    log('⟲ RESET — Schwert neu geschmiedet', 'ok');
});

document.getElementById('btn-auto').addEventListener('click', function() {
    state.autoMode = !state.autoMode;
    this.textContent = state.autoMode ? '⏸ PAUSE' : '▶ AUTO';
    if (state.autoMode) {
        log('▶ AUTO · Schwert schwingt automatisch', 'blade');
        state.running = true;
        document.getElementById('btn-start').textContent = '⏸ STOP';
        document.getElementById('state-display').textContent = '● auto';
        document.getElementById('state-display').style.color = 'var(--blade)';
        if (window.autoInterval) clearInterval(window.autoInterval);
        window.autoInterval = setInterval(function() {
            state.cycle++;
            document.getElementById('cycle-display').textContent = `SCHWERT ${state.cycle}`;
            cut();
            // Alle 10 Schnitte schärfen
            if (state.cycle % 10 === 0) {
                sharpen();
            }
            // Alle 20 Schnitte Monitor
            if (state.cycle % 20 === 0) {
                monitor81();
            }
            log(`🔄 Zyklus ${state.cycle}: ${state.cuts} Schnitte · ${(state.sharpness * 100).toFixed(0)}% Schärfe`, 'edge');
        }, 1500);
    } else {
        clearInterval(window.autoInterval);
        log('⏸ AUTO pausiert', 'ok');
        document.getElementById('state-display').textContent = '● pausiert';
        document.getElementById('state-display').style.color = '#ff4';
    }
});

// ============================================================
// 8. TASTATUR
// ============================================================
document.addEventListener('keydown', function(e) {
    if (e.key === ' ') { e.preventDefault(); document.getElementById('btn-start').click(); }
    if (e.key === 'c' || e.key === 'C') document.getElementById('btn-cut').click();
    if (e.key === 'x' || e.key === 'X') document.getElementById('btn-reset').click();
    if (e.key === 'a' || e.key === 'A') document.getElementById('btn-auto').click();
    if (e.key === 's' || e.key === 'S') { sharpen(); log('🗡️ Manuell geschärft', 'ok'); }
});
